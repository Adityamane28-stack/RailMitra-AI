<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RailMitra AI - Admin Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="login-page">


    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                🚆
            </div>

            <h1>
                RailMitra AI
            </h1>

            <p class="login-subtitle">
                Admin Dashboard
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Login
                </button>


                <p
                    id="loginError"
                    class="login-error"
                ></p>

            </form>


            <div class="login-footer">

                <a href="passenger.html">
                    ← Passenger Complaint Page
                </a>

            </div>

        </div>

    </div>


<script>


// =====================================================
// BACKEND URL
// =====================================================

const API_URL =
    "http://127.0.0.1:8001";


// =====================================================
// LOGIN FORM
// =====================================================

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const error =
                document
                    .getElementById("loginError");


            const loginButton =
                document
                    .getElementById("loginButton");


            error.textContent =
                "Logging in...";


            loginButton.disabled =
                true;


            try {

                // =========================================
                // CREATE FORM DATA
                // =========================================

                const formData =
                    new FormData();


                formData.append(
                    "username",
                    username
                );


                formData.append(
                    "password",
                    password
                );


                // =========================================
                // ADMIN LOGIN
                // =========================================

                const response =
                    await fetch(
                        `${API_URL}/admin/login`,
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                // =========================================
                // LOGIN FAILED
                // =========================================

                if (
                    !response.ok ||
                    data.success !== true
                ) {

                    error.textContent =
                        data.message ||
                        data.detail ||
                        "Invalid username or password.";

                    loginButton.disabled =
                        false;

                    return;

                }


                // =========================================
                // SAVE ADMIN JWT
                // =========================================

                localStorage.setItem(
                    "adminToken",
                    data.access_token
                );


                localStorage.setItem(
                    "adminRole",
                    data.role || "admin"
                );


                localStorage.setItem(
                    "adminUsername",
                    username
                );


                // =========================================
                // OLD FRONTEND LOGIN STATUS
                // Keep this temporarily so the
                // existing dashboard does not break.
                // =========================================

                sessionStorage.setItem(
                    "adminLoggedIn",
                    "true"
                );


                // =========================================
                // REDIRECT TO DASHBOARD
                // =========================================

               window.location.href =
               "admin-dashboard.html";
            }


            catch (err) {

                console.error(
                    "Admin login error:",
                    err
                );


                error.textContent =
                    "Could not connect to RailMitra AI server.";


                loginButton.disabled =
                    false;

            }

        }
    );

</script>


</body>

</html>
