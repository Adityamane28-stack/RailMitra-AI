<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailMitra AI | Passenger Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-card">
        <div class="auth-icon">🚆</div>
        <h1>RailMitra-AI</h1>
        <p class="auth-subtitle">Passenger Grievance Portal</p>

        <form id="passengerLoginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your registered username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your account password"
                    required
                >
            </div>

            <button
                type="submit"
                class="button button-primary"
                id="loginBtn"
                style="width:100%; padding:13px; font-size:15px; margin-top:6px;"
            >
                Login to Passenger Portal
            </button>
        </form>

        <div id="loginMsg" style="margin-top:14px; font-size:13px; min-height:18px;"></div>

        <div style="margin-top:20px; font-size:14px; color:#64748b;">
            Don't have an account?
            <a href="passenger-register.html" style="color:#2563eb; font-weight:700; text-decoration:none;">
                Create Account
            </a>
        </div>

        <div style="margin-top:24px; padding-top:16px; border-top:1px solid #e2e8f0; display:flex; justify-content:space-between; font-size:13px;">
            <a href="index.html" style="color:#2563eb; text-decoration:none;">← Home Page</a>
            <a href="login.html" style="color:#2563eb; text-decoration:none;">Admin Login →</a>
        </div>
    </div>

    <script>
        const API_BASE = (
            window.location.origin && (
                window.location.origin.includes(":8000") ||
                window.location.origin.includes(":8001")
            )
        ) ? window.location.origin : "http://127.0.0.1:8000";

        document.getElementById("passengerLoginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const msg = document.getElementById("loginMsg");
            const btn = document.getElementById("loginBtn");

            msg.textContent = "Authenticating passenger...";
            msg.style.color = "#475569";
            btn.disabled = true;

            const formData = new FormData();
            formData.append("username", username);
            formData.append("password", password);

            try {
                const response = await fetch(`${API_BASE}/passenger/login`, {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    msg.textContent = data.detail || data.message || "Invalid username or password";
                    msg.style.color = "#dc2626";
                    btn.disabled = false;
                    return;
                }

                localStorage.setItem("passengerToken", data.access_token);
                localStorage.setItem("passengerId", data.passenger_id);
                localStorage.setItem("passengerUsername", data.username);
                localStorage.setItem("passengerName", data.passenger_name);
                localStorage.setItem("passengerPhone", data.phone_number);

                msg.textContent = "Login successful! Launching dashboard...";
                msg.style.color = "#10b981";

                setTimeout(() => {
                    window.location.href = "passenger-dashboard.html";
                }, 600);

            } catch (err) {
                msg.textContent = "Cannot connect to RailMitra AI server. Ensure backend is running.";
                msg.style.color = "#dc2626";
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
