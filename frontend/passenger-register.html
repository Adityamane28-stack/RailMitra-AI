<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passenger Registration | RailMitra-AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #123c69;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            color: #123c69;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #123c69;
        }

        .register-btn {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #123c69;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #0d2d50;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #123c69;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            🚆 RailMitra-AI
        </div>

        <div class="subtitle">
            AI-Powered Railway Complaint Management
        </div>

        <h2>
            Create Passenger Account
        </h2>

        <form id="registerForm">

            <label for="passengerName">
                Full Name
            </label>

            <input
                type="text"
                id="passengerName"
                placeholder="Enter your full name"
                required
            >

            <label for="phoneNumber">
                Phone Number
            </label>

            <input
                type="tel"
                id="phoneNumber"
                placeholder="Enter your phone number"
                required
            >

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Create a username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter your password"
                required
            >

            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>

        </form>

        <div id="message"></div>

        <div class="login-link">

            Already have an account?

            <a href="passenger-login.html">
                Passenger Login
            </a>

        </div>

        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Home
        </a>

    </div>

    <script>

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");

        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const passengerName =
                    document.getElementById(
                        "passengerName"
                    ).value.trim();

                const phoneNumber =
                    document.getElementById(
                        "phoneNumber"
                    ).value.trim();

                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "password"
                    ).value;

                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;

                // Check passwords

                if (password !== confirmPassword) {

                    message.style.color = "red";

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }

                try {

                    message.style.color = "#555";

                    message.textContent =
                        "Creating account...";

                    // Create FormData for FastAPI Form(...) fields

                    const formData = new FormData();

                    formData.append(
                        "username",
                        username
                    );

                    formData.append(
                        "password",
                        password
                    );

                    formData.append(
                        "passenger_name",
                        passengerName
                    );

                    formData.append(
                        "phone_number",
                        phoneNumber
                    );

                    // Send registration request

                    const response = await fetch(
                        "http://127.0.0.1:8000/passenger/register",
                        {
                            method: "POST",
                            body: formData
                        }
                    );

                    const data =
                        await response.json();

                    if (!response.ok) {

                        message.style.color = "red";

                        message.textContent =
                            data.detail ||
                            "Registration failed.";

                        return;
                    }

                    message.style.color = "green";

                    message.textContent =
                        "Account created successfully!";

                    registerForm.reset();

                    setTimeout(function() {

                        window.location.href =
                            "passenger-login.html";

                    }, 1500);

                } catch (error) {

                    message.style.color = "red";

                    message.textContent =
                        "Cannot connect to the server. Make sure the backend is running.";

                    console.error(error);

                }

            }
        );

    </script>

</body>

</html>
