<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailMitra AI | Create Passenger Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-card" style="max-width:460px;">
        <div class="auth-icon">📝</div>
        <h1>RailMitra-AI</h1>
        <p class="auth-subtitle">Create Passenger Account</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="passengerName">Full Name</label>
                <input
                    type="text"
                    id="passengerName"
                    placeholder="e.g. Ramesh Kumar"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phoneNumber">Mobile Number</label>
                <input
                    type="tel"
                    id="phoneNumber"
                    placeholder="10-digit mobile number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Choose a unique username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a strong password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    required
                >
            </div>

            <button
                type="submit"
                class="button button-accent"
                id="regBtn"
                style="width:100%; padding:13px; font-size:15px; margin-top:6px;"
            >
                Register Account
            </button>
        </form>

        <div id="regMsg" style="margin-top:14px; font-size:13px; min-height:18px;"></div>

        <div style="margin-top:20px; font-size:14px; color:#64748b;">
            Already have an account?
            <a href="passenger-login.html" style="color:#2563eb; font-weight:700; text-decoration:none;">
                Passenger Login
            </a>
        </div>

        <div style="margin-top:24px; padding-top:16px; border-top:1px solid #e2e8f0; display:flex; justify-content:space-between; font-size:13px;">
            <a href="index.html" style="color:#2563eb; text-decoration:none;">← Home Page</a>
            <a href="login.html" style="color:#2563eb; text-decoration:none;">Admin Login →</a>
        </div>
    </div>

    <script>
        const API_BASE = (
            window.location.origin &&
            !window.location.origin.includes(":5500") &&
            !window.location.origin.includes(":3000") &&
            !window.location.origin.startsWith("file:")
        ) ? window.location.origin : "http://127.0.0.1:8000";

        document.getElementById("registerForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const pName = document.getElementById("passengerName").value.trim();
            const phone = document.getElementById("phoneNumber").value.trim();
            const uname = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;
            const cpass = document.getElementById("confirmPassword").value;
            const msg = document.getElementById("regMsg");
            const btn = document.getElementById("regBtn");

            if (pass !== cpass) {
                msg.textContent = "❌ Passwords do not match.";
                msg.style.color = "#dc2626";
                return;
            }

            msg.textContent = "Creating passenger account...";
            msg.style.color = "#475569";
            btn.disabled = true;

            const formData = new FormData();
            formData.append("username", uname);
            formData.append("password", pass);
            formData.append("passenger_name", pName);
            formData.append("phone_number", phone);

            try {
                const response = await fetch(`${API_BASE}/passenger/register`, {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    msg.textContent = `❌ ${data.detail || data.message || "Registration failed."}`;
                    msg.style.color = "#dc2626";
                    btn.disabled = false;
                    return;
                }

                msg.textContent = "✅ Account created successfully! Redirecting to login...";
                msg.style.color = "#10b981";

                setTimeout(() => {
                    window.location.href = "passenger-login.html";
                }, 1200);

            } catch (err) {
                msg.textContent = "❌ Cannot connect to server. Ensure backend is running.";
                msg.style.color = "#dc2626";
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
