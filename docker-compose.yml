version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: railmitra-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: railmitra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: railmitra-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/railmitra
      PORT: 8000
      HOST: 0.0.0.0
      JWT_SECRET_KEY: railmitra-super-secret-jwt-production-key-2026
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/backend/uploads

volumes:
  postgres_data:
  uploads_data:

